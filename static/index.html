<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canvas Grid Example</title>
        <style>
            body { margin: 0; }
            #container { position: relative; width: 100vw; height: 100vh; overflow: auto; }
            canvas { position: absolute; left: 0; top: 0; display: block; }
            header { 
                width: 100%;
                background-color: #1c1c1c;
                color: white;
                padding: 10px;
                position: fixed;
                z-index: 5;
            }
        </style>
    </head>

    <body>
        <div id="container">
            <!-- <header>
                <button>Connect</button>
                <button>Disconnect</button>
            </header> -->
            <canvas id="grid-canvas"></canvas>
            <canvas id="circle-canvas"></canvas>
        </div>
        <script>
            const WIDTH = 20000;
            const HEIGHT = 20000;
            const GRID_SIZE = 10;

            // Set up canvases
            const gridCanvas = document.getElementById('grid-canvas');
            const circleCanvas = document.getElementById('circle-canvas');
            gridCanvas.width = circleCanvas.width = WIDTH;
            gridCanvas.height = circleCanvas.height = HEIGHT;

            // Position canvases absolutely
            gridCanvas.style.zIndex = 0;
            circleCanvas.style.zIndex = 1;

            // Draw grid
            const drawGrid = (ctx) => {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                ctx.strokeStyle = 'gray';
                ctx.lineWidth = 1;
                for (let i = 0; i <= HEIGHT / GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, i * GRID_SIZE);
                    ctx.lineTo(WIDTH, i * GRID_SIZE);
                    ctx.stroke();
                }
                for (let j = 0; j <= WIDTH / GRID_SIZE; j++) {
                    ctx.beginPath();
                    ctx.moveTo(j * GRID_SIZE, 0);
                    ctx.lineTo(j * GRID_SIZE, HEIGHT);
                    ctx.stroke();
                }
            }

            // Draw circles based on graph state
            const drawGraphMembers = (ctx, graph) => {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                if (!Array.isArray(graph)) return;
                for (let x = 0; x < graph.length; x++) {
                    for (let y = 0; y < graph[x].length; y++) {
                        const node = graph[x][y];
                        if (!node || !Array.isArray(node.m)) continue;
                        const cx = x * GRID_SIZE + GRID_SIZE / 2;
                        const cy = y * GRID_SIZE + GRID_SIZE / 2;
                        // Draw a circle for each member
                        for (const member of node.m) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
                            ctx.fillStyle = member.typ === 'player' ? 'red' : 'blue';
                            ctx.fill();
                            ctx.strokeStyle = 'black';
                            ctx.stroke();
                        }
                    }
                }
            }

            drawGrid(gridCanvas.getContext('2d'));

            // Connect to backend and update graph
            const connectToGameUpdates = (playerID) => {
                const wsUrl = `ws://localhost:8080/updates/${playerID}`;
                const ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.graph) {
                            drawGraphMembers(circleCanvas.getContext('2d'), data.graph);
                        }
                    } catch (e) {
                        console.error('Error parsing message', e);
                    }
                };

                ws.onerror = (err) => {
                    console.error('WebSocket error', err);
                };

                ws.onclose = () => {
                    console.log('WebSocket closed, retrying in 2s...');
                    setTimeout(() => connectToGameUpdates(playerID), 2000);
                };

                // Optionally, expose ws for sending actions
                window.gameSocket = ws;
            }

            // Example: prompt for playerID and connect
            let playerID = localStorage.getItem('playerID');
            if (!playerID) {
                playerID = prompt('Enter your player ID:');
                if (playerID) localStorage.setItem('playerID', playerID);
            }
            if (playerID) {
                connectToGameUpdates(playerID);
            }
        </script>
    </body>
</html>
