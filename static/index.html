<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; cursor: crosshair; }
        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 8px 20px;
            background: transparent;
            color: rgba(255,255,255,0.5); display: flex; gap: 28px; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 12px; z-index: 10;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        #hud .logo {
            color: rgba(255,255,255,0.12); font-weight: 600;
            font-size: 11px; letter-spacing: 3px;
        }
        .res { display: flex; align-items: center; gap: 6px; }
        .res-val { color: rgba(255,255,255,0.7); }
        .dot {
            width: 6px; height: 6px; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 4px currentColor;
        }
        #info {
            position: fixed; bottom: 10px; left: 14px;
            color: rgba(255,255,255,0.15); font-size: 10px; z-index: 10;
            letter-spacing: 0.3px;
        }
        #selected-info {
            position: fixed; bottom: 10px; right: 14px;
            color: rgba(255,255,255,0.35); font-size: 11px; z-index: 10;
            text-align: right; letter-spacing: 0.3px;
        }
        #actions {
            position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
            display: none; gap: 8px; z-index: 10;
        }
        #actions.visible { display: flex; }
        #actions button {
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.08);
            padding: 6px 14px; font-family: inherit; font-size: 11px;
            cursor: pointer; border-radius: 2px;
            letter-spacing: 0.5px; text-transform: uppercase;
            transition: background 0.15s, border-color 0.15s;
        }
        #actions button:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
        #actions button:disabled { opacity: 0.25; cursor: default; }
        #actions button kbd {
            background: rgba(255,255,255,0.06); padding: 1px 4px;
            border-radius: 1px; font-size: 10px; margin-left: 4px;
        }
        #actions button .cost { color: rgba(255,255,255,0.3); font-size: 10px; }
    </style>
</head>
<body>
    <div id="hud">
        <span class="logo">ZONE</span>
        <div class="res"><span class="dot" style="color:#3a7abf"></span><span class="res-val" id="r-water">0</span></div>
        <div class="res"><span class="dot" style="color:#3a8a3a"></span><span class="res-val" id="r-wood">0</span></div>
        <div class="res"><span class="dot" style="color:#6a7080"></span><span class="res-val" id="r-metal">0</span></div>
        <div style="margin-left:auto; color:rgba(255,255,255,0.25); font-size:11px;"><span id="unit-count">0</span> units</div>
    </div>
    <canvas id="game"></canvas>
    <div id="actions">
        <button id="btn-house">House <kbd>H</kbd></button>
        <button id="btn-mine">Mine <kbd>M</kbd></button>
    </div>
    <div id="info">wasd &middot; scroll &middot; click &middot; drag &middot; h house &middot; m mine</div>
    <div id="selected-info"></div>

    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const TILE = 32;
    const GW = 1000, GH = 1000;
    const FOG_COLOR = '#000000';
    const DRAG_THRESHOLD = 5;

    const TILE_COLORS = {
        '':      '#080810',
        'water': '#06131f',
        'wood':  '#081208',
        'metal': '#0e0e14',
    };
    const TILE_BORDERS = {
        'water': '#1a3a5a',
        'wood':  '#1a3a1a',
        'metal': '#2a2a38',
    };
    const TILE_DIM = {
        '':      '#040408',
        'water': '#030a12',
        'wood':  '#040a04',
        'metal': '#08080c',
    };

    const cam = { x: 0, y: 0, zoom: 1.0 };

    let player = null;
    let selectedUnits = new Set();
    let playerID = localStorage.getItem('playerID');
    let ws = null;
    let buildCosts = { house: { resources: {}, buildTime: 0 }, mine: { resources: {}, buildTime: 0 } };

    const tileCache = new Map();
    const revealed = new Set();
    let currentVisible = new Set();

    let mouseDown = false;
    let dragStartScreen = null;
    let dragCurrentScreen = null;
    let isDragging = false;

    if (!playerID) {
        playerID = prompt('Enter your player name:');
        if (playerID) localStorage.setItem('playerID', playerID);
    }

    const MAP_STORAGE_KEY = `zone_map_${playerID}`;
    const MAP_HASH_KEY = `zone_hash_${playerID}`;
    const MAP_SAVE_INTERVAL = 3000;

    function saveMap() {
        const data = { revealed: [...revealed], tiles: {} };
        for (const key of revealed) {
            const tile = tileCache.get(key);
            if (tile) {
                const entry = { r: tile.r, s: tile.s };
                if (tile.b) { entry.b = tile.b; entry.bo = tile.bo; }
                data.tiles[key] = entry;
            }
        }
        try { localStorage.setItem(MAP_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    function loadMap() {
        try {
            const raw = localStorage.getItem(MAP_STORAGE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            if (data.revealed) for (const key of data.revealed) revealed.add(key);
            if (data.tiles) {
                for (const [key, val] of Object.entries(data.tiles)) {
                    if (!tileCache.has(key))
                        tileCache.set(key, { m: [], r: val.r || '', s: val.s || 0, b: val.b || '', bo: val.bo || '' });
                }
            }
        } catch (e) {}
    }

    loadMap();
    setInterval(saveMap, MAP_SAVE_INTERVAL);

    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === 'Escape') { selectedUnits.clear(); updateSelectedInfo(); }
        if (e.key.toLowerCase() === 'h') buildAction('build_house');
        if (e.key.toLowerCase() === 'm' && !e.ctrlKey) buildAction('build_mine');
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function screenToTile(sx, sy) {
        const ts = TILE * cam.zoom;
        return { x: Math.floor((sx + cam.x) / ts), y: Math.floor((sy + cam.y) / ts) };
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function computePath(fromX, fromY, toX, toY) {
        const path = [];
        let x = fromX, y = fromY;
        while (x !== toX || y !== toY) {
            x += Math.sign(toX - x);
            y += Math.sign(toY - y);
            path.push({ x, y });
        }
        return path;
    }

    function findMember(id) {
        for (const [key, tile] of tileCache) {
            if (!tile.m) continue;
            const member = tile.m.find(m => m.id === id);
            if (member) {
                const [x, y] = key.split(',').map(Number);
                return { member, x, y };
            }
        }
        return null;
    }

    function unitsInScreenRect(sx0, sy0, sx1, sy1) {
        const t0 = screenToTile(Math.min(sx0, sx1), Math.min(sy0, sy1));
        const t1 = screenToTile(Math.max(sx0, sx1), Math.max(sy0, sy1));
        const units = [];
        for (let x = Math.max(0, t0.x); x <= Math.min(GW - 1, t1.x); x++) {
            for (let y = Math.max(0, t0.y); y <= Math.min(GH - 1, t1.y); y++) {
                const tile = tileCache.get(x + ',' + y);
                if (!tile || !tile.m) continue;
                for (const m of tile.m) {
                    if (m.owner === playerID) units.push(m.id);
                }
            }
        }
        return units;
    }

    function distributeAlongLine(n, sx0, sy0, sx1, sy1) {
        const t0 = screenToTile(sx0, sy0);
        const t1 = screenToTile(sx1, sy1);
        if (n <= 1) return [{ x: clamp(t1.x, 0, GW - 1), y: clamp(t1.y, 0, GH - 1) }];
        const positions = [];
        for (let i = 0; i < n; i++) {
            const frac = i / (n - 1);
            positions.push({
                x: clamp(Math.round(t0.x + (t1.x - t0.x) * frac), 0, GW - 1),
                y: clamp(Math.round(t0.y + (t1.y - t0.y) * frac), 0, GH - 1),
            });
        }
        return positions;
    }

    function sendAction(action) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(action));
    }

    function sendMove(memberID, x, y) {
        sendAction({ type: 'move', member_id: memberID, x: clamp(x, 0, GW - 1), y: clamp(y, 0, GH - 1) });
    }

    function buildAction(type) {
        if (selectedUnits.size === 0) return;
        const first = findMember([...selectedUnits][0]);
        if (!first) return;
        sendAction({ type: type, x: first.x, y: first.y });
    }

    document.getElementById('btn-house').addEventListener('click', e => {
        e.stopPropagation(); buildAction('build_house');
    });
    document.getElementById('btn-mine').addEventListener('click', e => {
        e.stopPropagation(); buildAction('build_mine');
    });

    canvas.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        mouseDown = true;
        isDragging = false;
        dragStartScreen = { x: e.clientX, y: e.clientY };
        dragCurrentScreen = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('mousemove', e => {
        if (!mouseDown) return;
        dragCurrentScreen = { x: e.clientX, y: e.clientY };
        const dx = e.clientX - dragStartScreen.x;
        const dy = e.clientY - dragStartScreen.y;
        if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) isDragging = true;
    });

    canvas.addEventListener('mouseup', e => {
        if (e.button !== 0) { mouseDown = false; return; }
        const hasSelection = selectedUnits.size > 0;

        if (!isDragging) {
            const t = screenToTile(e.clientX, e.clientY);
            const key = t.x + ',' + t.y;
            const tile = tileCache.get(key);

            if (hasSelection) {
                if (tile && tile.m && currentVisible.has(key)) {
                    const ownUnit = tile.m.find(m => m.owner === playerID && !selectedUnits.has(m.id));
                    if (ownUnit) {
                        if (e.shiftKey) selectedUnits.add(ownUnit.id);
                        else { selectedUnits.clear(); selectedUnits.add(ownUnit.id); }
                        updateSelectedInfo();
                        mouseDown = false; isDragging = false;
                        return;
                    }
                }
                for (const id of selectedUnits) sendMove(id, t.x, t.y);
            } else {
                if (tile && tile.m && currentVisible.has(key)) {
                    const unit = tile.m.find(m => m.owner === playerID);
                    if (unit) selectedUnits.add(unit.id);
                }
            }
        } else {
            const sx0 = dragStartScreen.x, sy0 = dragStartScreen.y;
            const sx1 = e.clientX, sy1 = e.clientY;

            if (hasSelection) {
                const ids = [...selectedUnits];
                const positions = distributeAlongLine(ids.length, sx0, sy0, sx1, sy1);
                for (let i = 0; i < ids.length; i++) sendMove(ids[i], positions[i].x, positions[i].y);
            } else {
                const ids = unitsInScreenRect(sx0, sy0, sx1, sy1);
                selectedUnits.clear();
                for (const id of ids) selectedUnits.add(id);
            }
        }

        updateSelectedInfo();
        mouseDown = false;
        isDragging = false;
    });

    canvas.addEventListener('contextmenu', e => {
        e.preventDefault();
        selectedUnits.clear();
        updateSelectedInfo();
    });

    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const oldZoom = cam.zoom;
        cam.zoom *= e.deltaY < 0 ? 1.12 : 0.89;
        cam.zoom = clamp(cam.zoom, 0.1, 6);
        const factor = cam.zoom / oldZoom;
        cam.x = e.clientX * (factor - 1) + cam.x * factor;
        cam.y = e.clientY * (factor - 1) + cam.y * factor;
    }, { passive: false });

    function updateSelectedInfo() {
        const el = document.getElementById('selected-info');
        const actionsEl = document.getElementById('actions');

        if (selectedUnits.size === 0) {
            el.textContent = '';
            actionsEl.classList.remove('visible');
            return;
        }

        actionsEl.classList.add('visible');

        const btnHouse = document.getElementById('btn-house');
        const btnMine = document.getElementById('btn-mine');
        btnHouse.disabled = !canAffordClient(buildCosts.house);
        btnMine.disabled = selectedUnits.size < 5 || !canAffordClient(buildCosts.mine);

        if (selectedUnits.size === 1) {
            const id = [...selectedUnits][0];
            const found = findMember(id);
            if (found) {
                let info = `${found.x},${found.y}`;
                if (found.member.moving) info += ` > ${found.member.tx},${found.member.ty}`;
                el.textContent = info;
            } else {
                el.textContent = id;
            }
        } else {
            el.textContent = `${selectedUnits.size} selected`;
        }
    }

    function formatNumber(n) {
        if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
        if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
        return '' + n;
    }

    function costString(cost) {
        return Object.entries(cost.resources).map(([r, a]) => `${a} ${r}`).join(', ');
    }

    function canAffordClient(cost) {
        if (!player) return false;
        for (const [res, amount] of Object.entries(cost.resources)) {
            if ((player.resources[res] || 0) < amount) return false;
        }
        return true;
    }

    function updateBuildButtons() {
        const btnHouse = document.getElementById('btn-house');
        const btnMine = document.getElementById('btn-mine');
        btnHouse.innerHTML = `House <span class="cost">(${costString(buildCosts.house)}, ${buildCosts.house.buildTime}t)</span> <kbd>H</kbd>`;
        btnMine.innerHTML = `Mine <span class="cost">(${costString(buildCosts.mine)}, ${buildCosts.mine.buildTime}t)</span> <kbd>M</kbd>`;
    }

    function applyUpdate(data) {
        if (data.p) {
            player = data.p;
            document.getElementById('r-water').textContent = formatNumber(player.resources.water || 0);
            document.getElementById('r-wood').textContent = formatNumber(player.resources.wood || 0);
            document.getElementById('r-metal').textContent = formatNumber(player.resources.metal || 0);
        }

        if (data.v) {
            const newVisible = new Set();
            for (const tile of data.v) {
                const key = tile.x + ',' + tile.y;
                tileCache.set(key, {
                    m: tile.m || [],
                    r: tile.r || '',
                    s: tile.s || 0,
                    b: tile.b || '',
                    bo: tile.bo || '',
                    bp: tile.bp || 0,
                    bt: tile.bt || 0,
                    bc: tile.bc || false,
                });
                revealed.add(key);
                newVisible.add(key);
            }
            currentVisible = newVisible;
        }

        if (data.type === 'init' && data.spawnX !== undefined) {
            if (data.mapHash) {
                const storedHash = localStorage.getItem(MAP_HASH_KEY);
                if (storedHash && storedHash !== data.mapHash) {
                    tileCache.clear();
                    revealed.clear();
                    currentVisible = new Set();
                    localStorage.removeItem(MAP_STORAGE_KEY);
                }
                localStorage.setItem(MAP_HASH_KEY, data.mapHash);
            }
            cam.x = data.spawnX * TILE * cam.zoom - canvas.width / 2;
            cam.y = data.spawnY * TILE * cam.zoom - canvas.height / 2;
            if (data.costs) {
                buildCosts = data.costs;
                updateBuildButtons();
            }
        }
    }

    function connect() {
        if (!playerID) return;
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws/${playerID}`);
        ws.onmessage = e => { applyUpdate(JSON.parse(e.data)); };
        ws.onclose = () => { setTimeout(connect, 2000); };
        ws.onerror = () => {};
    }
    connect();

    // --- Building rendering ---
    function drawHouse(ctx, sx, sy, ts, isOwn) {
        const cx = sx + ts * 0.5;
        const baseY = sy + ts * 0.82;
        const size = ts * 0.3;
        ctx.fillStyle = isOwn ? 'rgba(200,150,50,0.5)' : 'rgba(140,70,70,0.4)';
        ctx.fillRect(cx - size * 0.5, baseY - size * 0.6, size, size * 0.6);
        ctx.beginPath();
        ctx.moveTo(cx - size * 0.6, baseY - size * 0.6);
        ctx.lineTo(cx, baseY - size * 1.1);
        ctx.lineTo(cx + size * 0.6, baseY - size * 0.6);
        ctx.closePath();
        ctx.fillStyle = isOwn ? 'rgba(160,110,30,0.6)' : 'rgba(120,50,50,0.5)';
        ctx.fill();
    }

    function drawMine(ctx, sx, sy, ts, isOwn) {
        const cx = sx + ts * 0.5;
        const cy = sy + ts * 0.78;
        const size = ts * 0.18;
        ctx.beginPath();
        ctx.moveTo(cx, cy - size);
        ctx.lineTo(cx + size, cy);
        ctx.lineTo(cx, cy + size);
        ctx.lineTo(cx - size, cy);
        ctx.closePath();
        ctx.fillStyle = isOwn ? 'rgba(80,150,200,0.5)' : 'rgba(130,90,90,0.4)';
        ctx.fill();
        ctx.strokeStyle = isOwn ? 'rgba(80,150,200,0.7)' : 'rgba(130,90,90,0.6)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }

    // --- Render ---
    function render() {
        const speed = 12 / cam.zoom;
        if (keys['w'] || keys['arrowup'])    cam.y -= speed;
        if (keys['s'] || keys['arrowdown'])  cam.y += speed;
        if (keys['a'] || keys['arrowleft'])  cam.x -= speed;
        if (keys['d'] || keys['arrowright']) cam.x += speed;

        const ts = TILE * cam.zoom;

        ctx.fillStyle = FOG_COLOR;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const x0 = Math.max(0, Math.floor(cam.x / ts));
        const y0 = Math.max(0, Math.floor(cam.y / ts));
        const x1 = Math.min(GW, Math.ceil((cam.x + canvas.width) / ts));
        const y1 = Math.min(GH, Math.ceil((cam.y + canvas.height) / ts));

        let unitCount = 0;

        for (let x = x0; x < x1; x++) {
            for (let y = y0; y < y1; y++) {
                const key = x + ',' + y;
                const isVisible = currentVisible.has(key);
                const isRevealed = revealed.has(key);

                if (!isRevealed) continue;

                const tile = tileCache.get(key);
                if (!tile) continue;

                const sx = x * ts - cam.x;
                const sy = y * ts - cam.y;
                const r = tile.r || '';

                ctx.fillStyle = isVisible
                    ? (TILE_COLORS[r] || TILE_COLORS[''])
                    : (TILE_DIM[r] || TILE_DIM['']);
                ctx.fillRect(sx, sy, ts, ts);

                if (isVisible && r && TILE_BORDERS[r]) {
                    ctx.strokeStyle = TILE_BORDERS[r];
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(sx + 1, sy + 1, ts - 2, ts - 2);
                }

                if (ts > 12) {
                    ctx.strokeStyle = isVisible ? 'rgba(255,255,255,0.025)' : 'rgba(255,255,255,0.01)';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(sx, sy, ts, ts);
                }

                if (isVisible && r && ts > 18) {
                    ctx.fillStyle = TILE_BORDERS[r];
                    ctx.globalAlpha = 0.3;
                    ctx.font = `${Math.max(7, ts * 0.2)}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(formatNumber(tile.s), sx + ts / 2, sy + ts - 2);
                    ctx.globalAlpha = 1;
                    ctx.textAlign = 'start';
                    ctx.textBaseline = 'alphabetic';
                }

                // Buildings
                if (tile.b && ts > 8) {
                    const isOwnBuilding = tile.bo === playerID;
                    const alpha = isVisible ? 1 : 0.4;
                    ctx.globalAlpha = tile.bc ? alpha * 0.4 : alpha;
                    if (tile.b === 'house') drawHouse(ctx, sx, sy, ts, isOwnBuilding);
                    else if (tile.b === 'mine') drawMine(ctx, sx, sy, ts, isOwnBuilding);
                    ctx.globalAlpha = 1;

                    if (tile.bc && tile.bt > 0 && isVisible && ts > 12) {
                        const barW = ts * 0.6;
                        const barH = Math.max(2, ts * 0.06);
                        const barX = sx + (ts - barW) / 2;
                        const barY = sy + ts - barH - 2;
                        const pct = tile.bp / tile.bt;
                        ctx.fillStyle = 'rgba(0,0,0,0.4)';
                        ctx.fillRect(barX, barY, barW, barH);
                        ctx.fillStyle = isOwnBuilding ? 'rgba(200,150,50,0.7)' : 'rgba(140,80,80,0.5)';
                        ctx.fillRect(barX, barY, barW * pct, barH);
                        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(barX, barY, barW, barH);
                    }
                }

                // Units
                if (isVisible && tile.m && tile.m.length > 0) {
                    const count = tile.m.length;
                    tile.m.forEach((member, i) => {
                        const offsetX = count > 1 ? (i - (count - 1) / 2) * ts * 0.18 : 0;
                        const cx = sx + ts / 2 + offsetX;
                        const cy = sy + ts / 2;
                        const radius = ts * 0.22;

                        const isOwn = member.owner === playerID;
                        if (isOwn) unitCount++;

                        const unitColor = isOwn ? [60, 200, 100] : [200, 60, 60];

                        ctx.beginPath();
                        ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${unitColor[0]},${unitColor[1]},${unitColor[2]},0.08)`;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${unitColor[0]},${unitColor[1]},${unitColor[2]},0.85)`;
                        ctx.fill();

                        if (selectedUnits.has(member.id)) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, radius + 2, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(255,220,80,0.7)';
                            ctx.lineWidth = 1.5;
                            ctx.stroke();
                        }

                        if (member.moving) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
                            ctx.strokeStyle = `rgba(${unitColor[0]},${unitColor[1]},${unitColor[2]},0.2)`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }

                        if (!member.moving && isOwn && r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, radius + 2, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                            ctx.lineWidth = 0.5;
                            ctx.setLineDash([2, 2]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    });

                    if (count > 1 && ts > 12) {
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.font = `${Math.max(7, ts * 0.22)}px monospace`;
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'top';
                        ctx.fillText(count, sx + ts - 2, sy + 2);
                        ctx.textAlign = 'start';
                        ctx.textBaseline = 'alphabetic';
                    }
                }
            }
        }

        document.getElementById('unit-count').textContent = unitCount;

        // Paths for all own navigating members
        const drawnPaths = new Set();
        for (const [key, tile] of tileCache) {
            if (!tile.m) continue;
            for (const member of tile.m) {
                if (member.owner !== playerID || !member.moving) continue;
                if (drawnPaths.has(member.id)) continue;
                drawnPaths.add(member.id);

                const [mx, my] = key.split(',').map(Number);
                const path = computePath(mx, my, member.tx, member.ty);
                if (path.length === 0) continue;

                const isSelected = selectedUnits.has(member.id);
                const baseAlpha = isSelected ? 0.15 : 0.05;
                const lineAlpha = isSelected ? 0.25 : 0.1;

                for (let i = 0; i < path.length; i++) {
                    const px = path[i].x * ts - cam.x;
                    const py = path[i].y * ts - cam.y;
                    if (px + ts < 0 || px > canvas.width || py + ts < 0 || py > canvas.height) continue;
                    const alpha = baseAlpha * (1 - i / path.length * 0.5);
                    ctx.fillStyle = isSelected
                        ? `rgba(255, 220, 80, ${alpha})`
                        : `rgba(60, 200, 100, ${alpha})`;
                    ctx.fillRect(px + 1, py + 1, ts - 2, ts - 2);
                }

                ctx.beginPath();
                ctx.moveTo(mx * ts - cam.x + ts / 2, my * ts - cam.y + ts / 2);
                for (const p of path) ctx.lineTo(p.x * ts - cam.x + ts / 2, p.y * ts - cam.y + ts / 2);
                ctx.strokeStyle = isSelected
                    ? `rgba(255, 220, 80, ${lineAlpha})`
                    : `rgba(60, 200, 100, ${lineAlpha})`;
                ctx.lineWidth = 1;
                ctx.setLineDash([2, 4]);
                ctx.stroke();
                ctx.setLineDash([]);

                const dest = path[path.length - 1];
                ctx.strokeStyle = isSelected ? 'rgba(255, 220, 80, 0.35)' : 'rgba(60, 200, 100, 0.2)';
                ctx.lineWidth = 1;
                ctx.strokeRect(dest.x * ts - cam.x + 2, dest.y * ts - cam.y + 2, ts - 4, ts - 4);
            }
        }

        // Fog edge
        if (ts > 8) {
            for (let x = x0; x < x1; x++) {
                for (let y = y0; y < y1; y++) {
                    const key = x + ',' + y;
                    if (!currentVisible.has(key)) continue;
                    const neighbors = [
                        (x-1)+','+y, (x+1)+','+y,
                        x+','+(y-1), x+','+(y+1),
                    ];
                    if (neighbors.some(n => !currentVisible.has(n))) {
                        const sx = x * ts - cam.x;
                        const sy = y * ts - cam.y;
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.fillRect(sx, sy, ts, ts);
                    }
                }
            }
        }

        // Drag visual
        if (isDragging && dragStartScreen && dragCurrentScreen) {
            if (selectedUnits.size > 0) {
                const n = selectedUnits.size;
                const positions = distributeAlongLine(n, dragStartScreen.x, dragStartScreen.y, dragCurrentScreen.x, dragCurrentScreen.y);

                ctx.beginPath();
                ctx.moveTo(dragStartScreen.x, dragStartScreen.y);
                ctx.lineTo(dragCurrentScreen.x, dragCurrentScreen.y);
                ctx.strokeStyle = 'rgba(255, 220, 80, 0.3)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                for (const pos of positions) {
                    const px = pos.x * ts - cam.x;
                    const py = pos.y * ts - cam.y;
                    ctx.fillStyle = 'rgba(255, 220, 80, 0.08)';
                    ctx.fillRect(px + 1, py + 1, ts - 2, ts - 2);
                    ctx.strokeStyle = 'rgba(255, 220, 80, 0.3)';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(px + 2, py + 2, ts - 4, ts - 4);
                }
            } else {
                const rx = Math.min(dragStartScreen.x, dragCurrentScreen.x);
                const ry = Math.min(dragStartScreen.y, dragCurrentScreen.y);
                const rw = Math.abs(dragCurrentScreen.x - dragStartScreen.x);
                const rh = Math.abs(dragCurrentScreen.y - dragStartScreen.y);
                ctx.strokeStyle = 'rgba(60, 200, 100, 0.35)';
                ctx.fillStyle = 'rgba(60, 200, 100, 0.04)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 5]);
                ctx.fillRect(rx, ry, rw, rh);
                ctx.strokeRect(rx, ry, rw, rh);
                ctx.setLineDash([]);
            }
        }

        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
    </script>
</body>
</html>
