<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050510; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; cursor: crosshair; }
        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 10px 16px;
            background: rgba(5, 5, 16, 0.94);
            color: #ccc; display: flex; gap: 24px; align-items: center;
            border-bottom: 1px solid #2a2a4a;
            font-size: 14px; z-index: 10;
        }
        .res { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        #info {
            position: fixed; bottom: 12px; left: 12px;
            color: #444; font-size: 11px; z-index: 10;
        }
        #selected-info {
            position: fixed; bottom: 12px; right: 12px;
            color: #888; font-size: 12px; z-index: 10;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="hud">
        <span style="color:#666; font-weight:bold;">ZONE</span>
        <div class="res"><span class="dot" style="background:#4488cc"></span>Water: <span id="r-water">0</span></div>
        <div class="res"><span class="dot" style="background:#44aa44"></span>Wood: <span id="r-wood">0</span></div>
        <div class="res"><span class="dot" style="background:#7788aa"></span>Metal: <span id="r-metal">0</span></div>
        <div style="margin-left:auto; color:#888;">Units: <span id="unit-count">0</span></div>
    </div>
    <canvas id="game"></canvas>
    <div id="info">WASD to pan &middot; Scroll to zoom &middot; Click unit to select &middot; Click tile to move</div>
    <div id="selected-info"></div>

    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Constants
    const TILE = 32;
    const GW = 1000, GH = 1000;
    const FOG_COLOR = '#050510';

    const TILE_COLORS = {
        '':      '#16162a',
        'water': '#12304a',
        'wood':  '#1a3318',
        'metal': '#252535',
    };
    const TILE_BORDERS = {
        'water': '#2a6090',
        'wood':  '#2a6630',
        'metal': '#4a4a60',
    };
    const TILE_DIM = {
        '':      '#0c0c18',
        'water': '#0a1a28',
        'wood':  '#0e1a0e',
        'metal': '#151520',
    };

    // Camera
    const cam = { x: 0, y: 0, zoom: 1.0 };

    // Game state
    let player = null;
    let selectedUnit = null;
    let playerID = localStorage.getItem('playerID');
    let ws = null;

    // Fog of war tile cache
    // tileCache: "x,y" -> {m, r, s} last known tile data
    // revealed: Set of "x,y" strings the player has ever seen
    // currentVisible: Set of "x,y" strings currently in vision
    const tileCache = new Map();
    const revealed = new Set();
    let currentVisible = new Set();

    if (!playerID) {
        playerID = prompt('Enter your player name:');
        if (playerID) localStorage.setItem('playerID', playerID);
    }

    // Input
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === 'Escape') { selectedUnit = null; updateSelectedInfo(); }
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function screenToTile(sx, sy) {
        const ts = TILE * cam.zoom;
        return {
            x: Math.floor((sx + cam.x) / ts),
            y: Math.floor((sy + cam.y) / ts),
        };
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // Compute the tile-by-tile path matching server movement (diagonal then straight)
    function computePath(fromX, fromY, toX, toY) {
        const path = [];
        let x = fromX, y = fromY;
        while (x !== toX || y !== toY) {
            x += Math.sign(toX - x);
            y += Math.sign(toY - y);
            path.push({ x, y });
        }
        return path;
    }

    // Find the selected unit's current position and data from the tile cache
    function findSelectedMember() {
        if (!selectedUnit) return null;
        for (const [key, tile] of tileCache) {
            if (!tile.m) continue;
            const member = tile.m.find(m => m.id === selectedUnit);
            if (member) {
                const [x, y] = key.split(',').map(Number);
                return { member, x, y };
            }
        }
        return null;
    }

    // Two-phase click: select unit, then click destination to move
    canvas.addEventListener('click', e => {
        const t = screenToTile(e.clientX, e.clientY);
        const key = t.x + ',' + t.y;
        const tile = tileCache.get(key);

        // If a unit is already selected, this click is a move command
        if (selectedUnit) {
            // Unless clicking another own unit — then reselect
            if (tile && tile.m && currentVisible.has(key)) {
                const ownUnit = tile.m.find(m => m.owner === playerID && m.id !== selectedUnit);
                if (ownUnit) {
                    selectedUnit = ownUnit.id;
                    updateSelectedInfo();
                    return;
                }
            }

            // Send move command
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'move',
                    member_id: selectedUnit,
                    x: clamp(t.x, 0, GW - 1),
                    y: clamp(t.y, 0, GH - 1),
                }));
            }
            // Keep unit selected so path stays visible while it moves
            updateSelectedInfo();
            return;
        }

        // No unit selected — try to select one
        if (!tile || !tile.m || !currentVisible.has(key)) return;
        const unit = tile.m.find(m => m.owner === playerID);
        if (unit) {
            selectedUnit = unit.id;
            updateSelectedInfo();
        }
    });

    // Right-click or Escape to deselect
    canvas.addEventListener('contextmenu', e => {
        e.preventDefault();
        selectedUnit = null;
        updateSelectedInfo();
    });

    // Zoom toward mouse
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const oldZoom = cam.zoom;
        cam.zoom *= e.deltaY < 0 ? 1.12 : 0.89;
        cam.zoom = clamp(cam.zoom, 0.1, 6);
        const factor = cam.zoom / oldZoom;
        cam.x = e.clientX * (factor - 1) + cam.x * factor;
        cam.y = e.clientY * (factor - 1) + cam.y * factor;
    }, { passive: false });

    function updateSelectedInfo() {
        const el = document.getElementById('selected-info');
        if (!selectedUnit) { el.textContent = ''; return; }

        // Find selected unit's tile for extra info
        let info = 'Selected: ' + selectedUnit;
        for (const [key, tile] of tileCache) {
            if (!tile.m) continue;
            const member = tile.m.find(m => m.id === selectedUnit);
            if (member) {
                const [x, y] = key.split(',');
                info = `Selected: ${selectedUnit} @ (${x}, ${y})`;
                if (member.moving) info += ` -> (${member.tx}, ${member.ty})`;
                break;
            }
        }
        el.textContent = info;
    }

    function formatNumber(n) {
        if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
        if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
        return '' + n;
    }

    // Process server update: sparse visible tiles
    function applyUpdate(data) {
        if (data.p) {
            player = data.p;
            document.getElementById('r-water').textContent = formatNumber(player.resources.water || 0);
            document.getElementById('r-wood').textContent = formatNumber(player.resources.wood || 0);
            document.getElementById('r-metal').textContent = formatNumber(player.resources.metal || 0);
        }

        if (data.v) {
            const newVisible = new Set();
            for (const tile of data.v) {
                const key = tile.x + ',' + tile.y;
                tileCache.set(key, { m: tile.m || [], r: tile.r || '', s: tile.s || 0 });
                revealed.add(key);
                newVisible.add(key);
            }
            currentVisible = newVisible;
        }

        if (data.type === 'init' && data.spawnX !== undefined) {
            cam.x = data.spawnX * TILE * cam.zoom - canvas.width / 2;
            cam.y = data.spawnY * TILE * cam.zoom - canvas.height / 2;
        }
    }

    // WebSocket
    function connect() {
        if (!playerID) return;
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws/${playerID}`);
        ws.onmessage = e => { applyUpdate(JSON.parse(e.data)); };
        ws.onclose = () => { setTimeout(connect, 2000); };
        ws.onerror = () => {};
    }
    connect();

    // Render
    function render() {
        // Camera movement (WASD)
        const speed = 12 / cam.zoom;
        if (keys['w'] || keys['arrowup'])    cam.y -= speed;
        if (keys['s'] || keys['arrowdown'])  cam.y += speed;
        if (keys['a'] || keys['arrowleft'])  cam.x -= speed;
        if (keys['d'] || keys['arrowright']) cam.x += speed;

        const ts = TILE * cam.zoom;

        // Clear
        ctx.fillStyle = FOG_COLOR;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Visible tile range on screen
        const x0 = Math.max(0, Math.floor(cam.x / ts));
        const y0 = Math.max(0, Math.floor(cam.y / ts));
        const x1 = Math.min(GW, Math.ceil((cam.x + canvas.width) / ts));
        const y1 = Math.min(GH, Math.ceil((cam.y + canvas.height) / ts));

        let unitCount = 0;

        for (let x = x0; x < x1; x++) {
            for (let y = y0; y < y1; y++) {
                const key = x + ',' + y;
                const isVisible = currentVisible.has(key);
                const isRevealed = revealed.has(key);

                // Fog: not revealed = don't draw (stays FOG_COLOR)
                if (!isRevealed) continue;

                const tile = tileCache.get(key);
                if (!tile) continue;

                const sx = x * ts - cam.x;
                const sy = y * ts - cam.y;
                const r = tile.r || '';

                // Tile fill: dim if revealed but not currently visible
                if (isVisible) {
                    ctx.fillStyle = TILE_COLORS[r] || TILE_COLORS[''];
                } else {
                    ctx.fillStyle = TILE_DIM[r] || TILE_DIM[''];
                }
                ctx.fillRect(sx, sy, ts, ts);

                // Resource border (only when visible)
                if (isVisible && r && TILE_BORDERS[r]) {
                    ctx.strokeStyle = TILE_BORDERS[r];
                    ctx.lineWidth = 1;
                    ctx.strokeRect(sx + 0.5, sy + 0.5, ts - 1, ts - 1);
                }

                // Grid line
                ctx.strokeStyle = isVisible ? '#1c1c35' : '#0e0e1c';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(sx, sy, ts, ts);

                // Resource supply label (visible tiles, zoomed in enough)
                if (isVisible && r && ts > 16) {
                    ctx.fillStyle = TILE_BORDERS[r];
                    ctx.globalAlpha = 0.45;
                    const fontSize = Math.max(7, ts * 0.22);
                    ctx.font = `${fontSize}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(formatNumber(tile.s), sx + ts / 2, sy + ts - 1);
                    ctx.globalAlpha = 1;
                    ctx.textAlign = 'start';
                    ctx.textBaseline = 'alphabetic';
                }

                // Members (only on visible tiles)
                if (isVisible && tile.m && tile.m.length > 0) {
                    const count = tile.m.length;
                    tile.m.forEach((member, i) => {
                        const offsetX = count > 1 ? (i - (count - 1) / 2) * ts * 0.2 : 0;
                        const cx = sx + ts / 2 + offsetX;
                        const cy = sy + ts / 2;
                        const radius = ts * 0.25;

                        const isOwn = member.owner === playerID;
                        if (isOwn) unitCount++;

                        // Shadow
                        ctx.beginPath();
                        ctx.arc(cx + 1, cy + 1, radius, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.fill();

                        // Unit circle
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.fillStyle = isOwn ? '#44cc66' : '#cc4444';
                        ctx.fill();

                        // Selection glow
                        if (member.id === selectedUnit) {
                            ctx.strokeStyle = '#ffcc00';
                            ctx.lineWidth = 2.5;
                            ctx.stroke();
                        }

                        // Moving indicator
                        if (member.moving) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
                            ctx.strokeStyle = isOwn ? 'rgba(68,204,102,0.4)' : 'rgba(204,68,68,0.3)';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }

                        // Mining indicator (idle on resource)
                        if (!member.moving && isOwn && r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, radius + 2, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                            ctx.lineWidth = 1;
                            ctx.setLineDash([2, 2]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    });
                }
            }
        }

        document.getElementById('unit-count').textContent = unitCount;

        // Draw tile-by-tile path for the selected unit
        if (selectedUnit) {
            const found = findSelectedMember();
            if (found && found.member.moving) {
                const path = computePath(found.x, found.y, found.member.tx, found.member.ty);

                // Highlight each tile along the path
                for (let i = 0; i < path.length; i++) {
                    const px = path[i].x * ts - cam.x;
                    const py = path[i].y * ts - cam.y;

                    // Skip tiles fully off screen
                    if (px + ts < 0 || px > canvas.width || py + ts < 0 || py > canvas.height) continue;

                    // Path tile highlight (fades toward destination)
                    const alpha = 0.15 + 0.15 * (1 - i / path.length);
                    ctx.fillStyle = `rgba(255, 204, 0, ${alpha})`;
                    ctx.fillRect(px + 1, py + 1, ts - 2, ts - 2);
                }

                // Draw connecting line through path centers
                if (path.length > 0) {
                    ctx.beginPath();
                    const startX = found.x * ts - cam.x + ts / 2;
                    const startY = found.y * ts - cam.y + ts / 2;
                    ctx.moveTo(startX, startY);
                    for (const p of path) {
                        ctx.lineTo(p.x * ts - cam.x + ts / 2, p.y * ts - cam.y + ts / 2);
                    }
                    ctx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([3, 3]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Destination marker
                const dest = path[path.length - 1];
                if (dest) {
                    const dx = dest.x * ts - cam.x;
                    const dy = dest.y * ts - cam.y;
                    ctx.strokeStyle = 'rgba(255, 204, 0, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(dx + 2, dy + 2, ts - 4, ts - 4);
                }
            }
        }

        // Fog edge glow: draw a subtle gradient at the boundary of vision
        // (skip if zoomed out too far for performance)
        if (ts > 8) {
            ctx.fillStyle = FOG_COLOR;
            for (let x = x0; x < x1; x++) {
                for (let y = y0; y < y1; y++) {
                    const key = x + ',' + y;
                    if (!currentVisible.has(key)) continue;
                    // Check if any neighbor is NOT visible -> edge tile
                    const neighbors = [
                        (x-1)+','+y, (x+1)+','+y,
                        x+','+(y-1), x+','+(y+1),
                    ];
                    const isEdge = neighbors.some(n => !currentVisible.has(n));
                    if (isEdge) {
                        const sx = x * ts - cam.x;
                        const sy = y * ts - cam.y;
                        ctx.globalAlpha = 0.15;
                        ctx.fillRect(sx, sy, ts, ts);
                        ctx.globalAlpha = 1;
                    }
                }
            }
        }

        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
    </script>
</body>
</html>
