<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Grid Example</title>
    <style>
        body { margin: 0; }
        #container { position: relative; width: 100vw; height: 100vh; overflow: auto; }
        canvas { position: absolute; left: 0; top: 0; display: block; }
    </style>
</head>

<body>
    <div id="container">
        <canvas id="grid-canvas"></canvas>
        <canvas id="circle-canvas"></canvas>
    </div>
    <script>
        const WIDTH = 20000;
        const HEIGHT = 20000;
        const NUMBER = 200000;
        const GRID_SIZE = 10;

        // Set up canvases
        const gridCanvas = document.getElementById('grid-canvas');
        const circleCanvas = document.getElementById('circle-canvas');
        gridCanvas.width = circleCanvas.width = WIDTH;
        gridCanvas.height = circleCanvas.height = HEIGHT;

        // Position canvases absolutely
        gridCanvas.style.zIndex = 0;
        circleCanvas.style.zIndex = 1;

        // Draw grid
        function drawGrid(ctx) {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            ctx.strokeStyle = 'gray';
            ctx.lineWidth = 1;
            for (let i = 0; i <= HEIGHT / GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(WIDTH, i * GRID_SIZE);
                ctx.stroke();
            }
            console.log("Drew X!");
            for (let j = 0; j <= WIDTH / GRID_SIZE; j++) {
                ctx.beginPath();
                ctx.moveTo(j * GRID_SIZE, 0);
                ctx.lineTo(j * GRID_SIZE, HEIGHT);
                ctx.stroke();
            }
            console.log("Drew Y!");
        }

        // Draw circles
        function drawCircles(ctx, circles) {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            for (const c of circles) {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = c.color;
                ctx.fill();
                ctx.strokeStyle = 'black';
                ctx.stroke();
            }
        }

        // Generate random circles
        const colors = ['red', 'green', 'blue'];
        const labels = ['Manpower', 'Ore', 'Food'];
        const circles = [];
        for (let i = 0; i < NUMBER; i++) {
            const x = Math.floor(Math.random() * (WIDTH / GRID_SIZE)) * GRID_SIZE + GRID_SIZE / 2;
            const y = Math.floor(Math.random() * (HEIGHT / GRID_SIZE)) * GRID_SIZE + GRID_SIZE / 2;
            const index = Math.floor(Math.random() * colors.length);
            circles.push({ x, y, color: colors[index], label: labels[index] });
        }

        drawGrid(gridCanvas.getContext('2d'));
        drawCircles(circleCanvas.getContext('2d'), circles);
    </script>
</body>

</html>
